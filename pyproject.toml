[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-app"
version = "0.2.0"
description = "巴别塔 Babel：Windows 实时声音翻译与视频翻译工具，支持 Whisper 语音识别、自动中文字幕和 SRT 字幕导出"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "luoyeguishanhe"}]
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.5",
    "PyAudioWPatch>=0.2.12",
    "numpy>=1.24,<2.3",
    "soxr>=0.5",
    "webrtcvad-wheels>=2.0.14",
    "faster-whisper>=1.1",
    "opencc-python-reimplemented>=0.1.7",
    "av>=11",
    "imageio-ffmpeg>=0.6",
]

[project.scripts]
subtitle-app = "subtitle_app.startup:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]
gpu = [
    "nvidia-cublas-cu12>=12.8,<13; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.7,<10; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["src"]
