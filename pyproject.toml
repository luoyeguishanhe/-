[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-app"
version = "0.1.0"
description = "实时中文字幕桌面应用（开发中）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.5",
    "PyAudioWPatch>=0.2.12",
    "numpy>=1.24,<2.3",
    "soxr>=0.5",
    "webrtcvad-wheels>=2.0.14",
    "faster-whisper>=1.1",
    "opencc-python-reimplemented>=0.1.7",
    "av>=11",
    "imageio-ffmpeg>=0.6",
]

[project.scripts]
subtitle-app = "subtitle_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
