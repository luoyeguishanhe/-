[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-app"
version = "0.1.0"
description = "实时中文字幕桌面应用（开发中）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.5", "PyAudioWPatch>=0.2.12"]

[project.scripts]
subtitle-app = "subtitle_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
